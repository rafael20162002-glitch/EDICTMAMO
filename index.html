<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Editor de Requisição de Mamografia</title>

<style>

body{
font-family:Arial;
background:#eef2f7;
margin:0;
}

header{
background:#003366;
color:white;
padding:20px;
text-align:center;
font-size:22px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:30px;
margin-top:30px;
border-radius:8px;
}

input{
padding:10px;
width:100%;
margin-bottom:10px;
}

button{
background:#0066cc;
color:white;
border:none;
padding:12px;
font-size:16px;
border-radius:5px;
cursor:pointer;
}

#editor{
display:none;
margin-top:40px;
}

.pagina{
width:210mm;
height:297mm;
position:relative;
margin:auto;
background:white;
border:1px solid #ccc;
}

.formbg{
position:absolute;
top:0;
left:0;
width:100%;
}

/* CAMPOS */

.campo{
position:absolute;
font-size:16px;
font-weight:bold;
letter-spacing:6px;
cursor:move;
background:rgba(255,255,0,0.3);
padding:2px;
}

/* GRID DE AJUSTE */

.grid{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background-image:
linear-gradient(to right, rgba(0,0,0,0.1) 1px, transparent 1px),
linear-gradient(to bottom, rgba(0,0,0,0.1) 1px, transparent 1px);

background-size:20px 20px;
pointer-events:none;
}

#coords{
position:fixed;
bottom:10px;
right:10px;
background:black;
color:white;
padding:10px;
font-size:12px;
}

@media print{

body *{
visibility:hidden;
}

#editor, #editor *{
visibility:visible;
}

.grid{
display:none;
}

.campo{
background:none;
}

}

</style>

</head>

<body>

<header>
Sistema de Requisição de Mamografia
</header>

<div class="container">

<h3>Dados da paciente</h3>

<input id="nome" placeholder="Nome">

<input id="cpf" placeholder="CPF">

<input id="sus" placeholder="Cartão SUS">

<input id="nascimento" type="date">

<button onclick="gerar()">Gerar Requisição</button>

</div>

<div id="editor">

<div class="pagina">

<img src="formulario1.png" class="formbg">

<div class="grid"></div>

<div class="campo" id="r_nome" style="top:260px;left:60px"></div>

<div class="campo" id="r_cpf" style="top:300px;left:60px"></div>

<div class="campo" id="r_sus" style="top:340px;left:60px"></div>

</div>

</div>

<div id="coords">
x:0 y:0
</div>

<script>

function gerar(){

document.getElementById("r_nome").innerText =
document.getElementById("nome").value.toUpperCase()

document.getElementById("r_cpf").innerText =
document.getElementById("cpf").value

document.getElementById("r_sus").innerText =
document.getElementById("sus").value

document.getElementById("editor").style.display="block"

}

let campoSelecionado = null
let offsetX = 0
let offsetY = 0

document.querySelectorAll(".campo").forEach(campo=>{

campo.addEventListener("mousedown",e=>{

campoSelecionado = campo

offsetX = e.offsetX
offsetY = e.offsetY

})

})

document.addEventListener("mousemove",e=>{

if(campoSelecionado){

let pagina = document.querySelector(".pagina").getBoundingClientRect()

let x = e.clientX - pagina.left - offsetX
let y = e.clientY - pagina.top - offsetY

campoSelecionado.style.left = x + "px"
campoSelecionado.style.top = y + "px"

document.getElementById("coords").innerText =
"x:" + x + " y:" + y

}

})

document.addEventListener("mouseup",()=>{

campoSelecionado = null

})

</script>

</body>

</html>
