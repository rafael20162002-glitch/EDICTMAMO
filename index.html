<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Sistema de Requisição de Mamografia</title>

<style>

body{
font-family:Arial;
background:#eef2f7;
margin:0;
}

header{
background:#003366;
color:white;
padding:20px;
text-align:center;
font-size:22px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:30px;
margin-top:30px;
border-radius:8px;
}

input{
width:100%;
padding:8px;
margin-bottom:8px;
text-transform:uppercase;
}

button{
background:#0066cc;
color:white;
border:none;
padding:12px;
border-radius:5px;
margin-top:10px;
cursor:pointer;
}

#editor{
display:none;
margin-top:40px;
}

/* PAGINA */

.pagina{
width:210mm;
height:297mm;
position:relative;
margin:auto;
background:white;
border:1px solid #ccc;
page-break-after:always;
}

.formbg{
position:absolute;
width:100%;
top:0;
left:0;
}

/* CAMPOS */

.campo{
position:absolute;
font-size:14px;
font-weight:bold;
letter-spacing:3px;
background:rgba(255,255,0,0.3);
cursor:move;
padding:2px;
white-space:nowrap;
}

/* GRID */

.grid{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background-image:
linear-gradient(to right, rgba(0,0,0,0.1) 1px, transparent 1px),
linear-gradient(to bottom, rgba(0,0,0,0.1) 1px, transparent 1px);
background-size:20px 20px;
pointer-events:none;
}

#coords{
position:fixed;
bottom:10px;
right:10px;
background:black;
color:white;
padding:8px;
font-size:12px;
}

/* PRINT */

@media print{

body *{
visibility:hidden;
}

#editor, #editor *{
visibility:visible;
}

.grid{
display:none;
}

.campo{
background:none;
}

button{
display:none;
}

}

</style>

</head>

<body>

<header>
Sistema de Requisição de Mamografia
</header>

<div class="container">

<h3>Dados da Unidade</h3>

<input id="uf" placeholder="UF">
<input id="cnes" placeholder="Código CNES">
<input id="unidade" placeholder="Unidade de Saúde">
<input id="cod_municipio" placeholder="Código do Município">
<input id="municipio" placeholder="Município">
<input id="prontuario" placeholder="Prontuário">

<h3>Paciente</h3>

<input id="sus" placeholder="Cartão SUS">
<input id="nome" placeholder="Nome da paciente">
<input id="apelido" placeholder="Apelido">
<input id="mae" placeholder="Nome da mãe">

<input id="rg" placeholder="Identidade RG">
<input id="orgao" placeholder="Órgão emissor">
<input id="uf_doc" placeholder="UF documento">
<input id="cpf" placeholder="CPF">

<input id="nascimento" placeholder="Data nascimento">
<input id="idade" placeholder="Idade">
<input id="nacionalidade" placeholder="Nacionalidade">

<h3>Endereço</h3>

<input id="logradouro" placeholder="Logradouro">
<input id="numero" placeholder="Número">
<input id="complemento" placeholder="Complemento">
<input id="bairro" placeholder="Bairro">

<input id="uf_end" placeholder="UF endereço">
<input id="cod_mun_end" placeholder="Código município">
<input id="mun_end" placeholder="Município endereço">

<input id="cep" placeholder="CEP">
<input id="ddd" placeholder="DDD">
<input id="telefone" placeholder="Telefone">

<input id="referencia" placeholder="Ponto de referência">

<h3>Exame</h3>

<input id="ultima_mamo" placeholder="Data última mamografia">
<input id="data_solic" placeholder="Data solicitação">
<input id="examinador" placeholder="Examinador">
<input id="num_exame" placeholder="Número do exame">
<input id="num_servico" placeholder="Número serviço mamografia">

<button onclick="gerar()">Gerar Requisição</button>

</div>

<div id="editor">

<div class="pagina">

<img src="formulario1.png" class="formbg">

<div class="grid"></div>

<!-- CAMPOS -->

<div class="campo" id="r_uf" style="top:40px;left:50px"></div>
<div class="campo" id="r_cnes" style="top:60px;left:50px"></div>
<div class="campo" id="r_unidade" style="top:80px;left:50px"></div>
<div class="campo" id="r_cod_municipio" style="top:100px;left:50px"></div>
<div class="campo" id="r_municipio" style="top:120px;left:50px"></div>
<div class="campo" id="r_prontuario" style="top:140px;left:50px"></div>

<div class="campo" id="r_sus" style="top:170px;left:50px"></div>
<div class="campo" id="r_nome" style="top:190px;left:50px"></div>
<div class="campo" id="r_apelido" style="top:210px;left:50px"></div>
<div class="campo" id="r_mae" style="top:230px;left:50px"></div>

<div class="campo" id="r_rg" style="top:260px;left:50px"></div>
<div class="campo" id="r_orgao" style="top:280px;left:50px"></div>
<div class="campo" id="r_uf_doc" style="top:300px;left:50px"></div>
<div class="campo" id="r_cpf" style="top:320px;left:50px"></div>

<div class="campo" id="r_nascimento" style="top:350px;left:50px"></div>
<div class="campo" id="r_idade" style="top:370px;left:50px"></div>
<div class="campo" id="r_nacionalidade" style="top:390px;left:50px"></div>

<div class="campo" id="r_logradouro" style="top:420px;left:50px"></div>
<div class="campo" id="r_numero" style="top:440px;left:50px"></div>
<div class="campo" id="r_complemento" style="top:460px;left:50px"></div>
<div class="campo" id="r_bairro" style="top:480px;left:50px"></div>

<div class="campo" id="r_uf_end" style="top:510px;left:50px"></div>
<div class="campo" id="r_cod_mun_end" style="top:530px;left:50px"></div>
<div class="campo" id="r_mun_end" style="top:550px;left:50px"></div>

<div class="campo" id="r_cep" style="top:580px;left:50px"></div>
<div class="campo" id="r_ddd" style="top:600px;left:50px"></div>
<div class="campo" id="r_telefone" style="top:620px;left:50px"></div>

<div class="campo" id="r_referencia" style="top:650px;left:50px"></div>

<div class="campo" id="r_ultima_mamo" style="top:680px;left:50px"></div>
<div class="campo" id="r_data_solic" style="top:700px;left:50px"></div>
<div class="campo" id="r_examinador" style="top:720px;left:50px"></div>
<div class="campo" id="r_num_exame" style="top:740px;left:50px"></div>
<div class="campo" id="r_num_servico" style="top:760px;left:50px"></div>

</div>

<center style="margin-top:30px">
<button onclick="window.print()">Imprimir</button>
</center>

</div>

<div id="coords">x:0 y:0</div>

<script>

/* ESCREVER */

function escrever(i,c){

let input=document.getElementById(i)
let campo=document.getElementById(c)

if(input && campo){
campo.innerText=input.value.toUpperCase()
}

}

/* GERAR */

function gerar(){

let campos=[

"uf","cnes","unidade","cod_municipio","municipio","prontuario",
"sus","nome","apelido","mae",
"rg","orgao","uf_doc","cpf",
"nascimento","idade","nacionalidade",
"logradouro","numero","complemento","bairro",
"uf_end","cod_mun_end","mun_end",
"cep","ddd","telefone","referencia",
"ultima_mamo","data_solic","examinador","num_exame","num_servico"

]

campos.forEach(function(c){

escrever(c,"r_"+c)

})

document.getElementById("editor").style.display="block"

}

/* DRAG */

let campoSelecionado=null
let offsetX=0
let offsetY=0

document.querySelectorAll(".campo").forEach(campo=>{

campo.addEventListener("mousedown",function(e){

campoSelecionado=campo
offsetX=e.offsetX
offsetY=e.offsetY

})

})

document.addEventListener("mousemove",function(e){

if(campoSelecionado){

let pagina=campoSelecionado.closest(".pagina").getBoundingClientRect()

let x=e.clientX-pagina.left-offsetX
let y=e.clientY-pagina.top-offsetY

campoSelecionado.style.left=x+"px"
campoSelecionado.style.top=y+"px"

document.getElementById("coords").innerText="x:"+x+" y:"+y

}

})

document.addEventListener("mouseup",function(){

campoSelecionado=null

})

</script>

</body>
</html>
