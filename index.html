<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Sistema de Requisição de Mamografia</title>

<style>

body{
font-family:Arial;
background:#eef2f7;
margin:0;
}

header{
background:#003366;
color:white;
padding:20px;
text-align:center;
font-size:22px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:30px;
margin-top:30px;
border-radius:8px;
}

input{
width:100%;
padding:8px;
margin-bottom:8px;
text-transform:uppercase;
}

button{
background:#0066cc;
color:white;
border:none;
padding:12px;
border-radius:5px;
cursor:pointer;
margin-top:10px;
}

#editor{
display:none;
margin-top:40px;
}

/* PAGINAS */

.pagina{
width:210mm;
height:297mm;
position:relative;
margin:auto;
background:white;
border:1px solid #ccc;
margin-bottom:20px;
page-break-after:always;
}

.formbg{
position:absolute;
width:100%;
top:0;
left:0;
}

/* CAMPOS */

.campo{
position:absolute;
font-size:14px;
font-weight:bold;
letter-spacing:2px;
background:rgba(255,255,0,0.3);
padding:2px;
cursor:move;
white-space:nowrap;
}

/* GRID */

.grid{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background-image:
linear-gradient(to right, rgba(0,0,0,0.1) 1px, transparent 1px),
linear-gradient(to bottom, rgba(0,0,0,0.1) 1px, transparent 1px);
background-size:20px 20px;
pointer-events:none;
}

#coords{
position:fixed;
bottom:10px;
right:10px;
background:black;
color:white;
padding:6px;
font-size:12px;
}

/* IMPRESSÃO */

@media print{

body *{
visibility:hidden;
}

#editor, #editor *{
visibility:visible;
}

.grid{
display:none;
}

.campo{
background:none;
}

button{
display:none;
}

}

</style>

</head>

<body>

<header>
Sistema de Requisição de Mamografia
</header>

<div class="container">

<h3>Dados da paciente</h3>

<input id="nome" placeholder="Nome">
<input id="cpf" placeholder="CPF">
<input id="sus" placeholder="Cartão SUS">
<input id="mae" placeholder="Nome da mãe">

<h3>Unidade</h3>

<input id="municipio" placeholder="Município">
<input id="unidade" placeholder="Unidade de Saúde">

<h3>Endereço</h3>

<input id="logradouro" placeholder="Logradouro">
<input id="bairro" placeholder="Bairro">
<input id="cep" placeholder="CEP">
<input id="telefone" placeholder="Telefone">

<button onclick="gerar()">Gerar Requisição</button>

</div>

<div id="editor">

<!-- PAGINA 1 -->

<div class="pagina">

<img src="formulario1.png" class="formbg">

<div class="grid"></div>

<div class="campo" id="r_nome" style="top:200px;left:120px"></div>
<div class="campo" id="r_cpf" style="top:230px;left:120px"></div>
<div class="campo" id="r_sus" style="top:260px;left:120px"></div>
<div class="campo" id="r_mae" style="top:290px;left:120px"></div>
<div class="campo" id="r_municipio" style="top:320px;left:120px"></div>
<div class="campo" id="r_unidade" style="top:350px;left:120px"></div>

</div>

<!-- PAGINA 2 -->

<div class="pagina">

<img src="formulario2.png" class="formbg">

<div class="grid"></div>

<div class="campo" id="r_logradouro" style="top:200px;left:120px"></div>
<div class="campo" id="r_bairro" style="top:230px;left:120px"></div>
<div class="campo" id="r_cep" style="top:260px;left:120px"></div>
<div class="campo" id="r_telefone" style="top:290px;left:120px"></div>

</div>

<center>
<button onclick="window.print()">Imprimir</button>
</center>

</div>

<div id="coords">x:0 y:0</div>

<script>

/* GERAR REQUISIÇÃO */

function gerar(){

document.querySelectorAll("input").forEach(function(input){

let campo=document.getElementById("r_"+input.id)

if(campo){
campo.innerText=input.value.toUpperCase()
}

})

document.getElementById("editor").style.display="block"

window.scrollTo(0,document.body.scrollHeight)

}

/* ARRASTAR CAMPOS */

let campoSelecionado=null
let offsetX=0
let offsetY=0

document.querySelectorAll(".campo").forEach(function(campo){

campo.addEventListener("mousedown",function(e){

campoSelecionado=campo
offsetX=e.offsetX
offsetY=e.offsetY

})

})

document.addEventListener("mousemove",function(e){

if(campoSelecionado){

let pagina=campoSelecionado.closest(".pagina").getBoundingClientRect()

let x=e.clientX-pagina.left-offsetX
let y=e.clientY-pagina.top-offsetY

campoSelecionado.style.left=x+"px"
campoSelecionado.style.top=y+"px"

document.getElementById("coords").innerText="x:"+x+" y:"+y

}

})

document.addEventListener("mouseup",function(){

campoSelecionado=null

})

</script>

</body>
</html>
