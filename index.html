<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Requisição de Mamografia</title>

<style>

body{
font-family:Arial;
background:#eef2f7;
margin:0;
}

header{
background:#003366;
color:white;
padding:20px;
text-align:center;
font-size:22px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:30px;
margin-top:30px;
border-radius:8px;
}

input{
width:100%;
padding:10px;
margin-bottom:10px;
}

button{
background:#0066cc;
color:white;
border:none;
padding:12px;
font-size:16px;
border-radius:5px;
cursor:pointer;
}

#editor{
display:none;
margin-top:40px;
}

/* PAGINAS */

.pagina{
width:210mm;
height:297mm;
position:relative;
margin:auto;
background:white;
page-break-after:always;
}

.formbg{
position:absolute;
top:0;
left:0;
width:100%;
}

/* TEXTO EM CAIXAS */

.caixas{
position:absolute;
font-size:14px;
font-weight:bold;
letter-spacing:10px;
white-space:nowrap;
}

/* CHECK */

.check{
position:absolute;
font-size:22px;
}

@media print{

body *{
visibility:hidden;
}

#editor,#editor *{
visibility:visible;
}

button{
display:none;
}

}

</style>

</head>

<body>

<header>
Sistema de Requisição de Mamografia
</header>

<div class="container">

<h3>Dados da paciente</h3>

<input id="nome" placeholder="Nome">

<input id="cpf" placeholder="CPF">

<input id="sus" placeholder="Cartão SUS">

<input id="nascimento" placeholder="Data nascimento">

<input id="mae" placeholder="Nome da mãe">

<h3>Unidade</h3>

<input id="municipio" placeholder="Município">

<input id="unidade" placeholder="Unidade de saúde">

<h3>Endereço</h3>

<input id="logradouro" placeholder="Logradouro">

<input id="bairro" placeholder="Bairro">

<input id="cep" placeholder="CEP">

<input id="telefone" placeholder="Telefone">

<h3>Indicação clínica</h3>

<label><input type="checkbox" id="rastreamento"> Rastreamento</label><br>
<label><input type="checkbox" id="diagnostica"> Diagnóstica</label><br>
<label><input type="checkbox" id="nodulo"> Nódulo palpável</label><br>

<br>

<button onclick="gerar()">Gerar requisição</button>

</div>

<div id="editor">

<!-- PAGINA 1 -->

<div class="pagina">

<img src="formulario1.png" class="formbg">

<div class="caixas" id="r_nome" style="top:240px;left:150px"></div>

<div class="caixas" id="r_cpf" style="top:270px;left:150px"></div>

<div class="caixas" id="r_sus" style="top:300px;left:150px"></div>

<div class="caixas" id="r_nascimento" style="top:330px;left:150px"></div>

<div class="caixas" id="r_mae" style="top:360px;left:150px"></div>

<div class="caixas" id="r_municipio" style="top:390px;left:150px"></div>

<div class="caixas" id="r_unidade" style="top:420px;left:150px"></div>

<div class="caixas" id="r_logradouro" style="top:450px;left:150px"></div>

<div class="caixas" id="r_bairro" style="top:480px;left:150px"></div>

<div class="caixas" id="r_cep" style="top:510px;left:150px"></div>

<div class="caixas" id="r_telefone" style="top:540px;left:150px"></div>

<div class="check" id="c_rastreamento" style="top:700px;left:120px">X</div>

<div class="check" id="c_diagnostica" style="top:730px;left:120px">X</div>

<div class="check" id="c_nodulo" style="top:760px;left:120px">X</div>

</div>

<!-- PAGINA 2 -->

<div class="pagina">

<img src="formulario2.png" class="formbg">

</div>

<center style="margin-top:30px">
<button onclick="window.print()">Imprimir</button>
</center>

</div>

<script>

function escreverCaixas(input,campo){

let texto=document.getElementById(input).value.toUpperCase()

let letras=texto.split("").join(" ")

document.getElementById(campo).innerText=letras

}

function marcar(check,campo){

let c=document.getElementById(check)

let d=document.getElementById(campo)

d.style.display=c.checked?"block":"none"

}

function gerar(){

escreverCaixas("nome","r_nome")
escreverCaixas("cpf","r_cpf")
escreverCaixas("sus","r_sus")
escreverCaixas("nascimento","r_nascimento")
escreverCaixas("mae","r_mae")

escreverCaixas("municipio","r_municipio")
escreverCaixas("unidade","r_unidade")

escreverCaixas("logradouro","r_logradouro")
escreverCaixas("bairro","r_bairro")
escreverCaixas("cep","r_cep")
escreverCaixas("telefone","r_telefone")

marcar("rastreamento","c_rastreamento")
marcar("diagnostica","c_diagnostica")
marcar("nodulo","c_nodulo")

document.getElementById("editor").style.display="block"

window.scrollTo(0,document.body.scrollHeight)

}

</script>

</body>

</html>
