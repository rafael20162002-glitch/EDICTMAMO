<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Requisição de Mamografia</title>

<style>

body{
font-family:Arial;
background:#eef2f7;
margin:0;
}

header{
background:#003366;
color:white;
padding:20px;
text-align:center;
font-size:22px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:30px;
margin-top:30px;
border-radius:8px;
}

input{
width:100%;
padding:10px;
margin-bottom:10px;
text-transform:uppercase;
}

button{
background:#0066cc;
color:white;
border:none;
padding:12px;
font-size:16px;
border-radius:5px;
cursor:pointer;
}

#editor{
display:none;
margin-top:40px;
}

/* PAGINAS */

.pagina{
width:210mm;
height:297mm;
position:relative;
margin:auto;
background:white;
border:1px solid #ccc;
page-break-after:always;
}

.formbg{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
object-fit:contain;
}

/* CAMPOS */

.campo{
position:absolute;
font-size:14px;
font-weight:bold;
letter-spacing:6px;
white-space:nowrap;
cursor:move;
background:rgba(255,255,0,0.3);
padding:2px;
}

/* GRID DE AJUDA */

.grid{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background-image:
linear-gradient(to right, rgba(0,0,0,0.1) 1px, transparent 1px),
linear-gradient(to bottom, rgba(0,0,0,0.1) 1px, transparent 1px);
background-size:20px 20px;
pointer-events:none;
}

/* COORDENADAS */

#coords{
position:fixed;
bottom:10px;
right:10px;
background:black;
color:white;
padding:8px;
font-size:12px;
}

/* IMPRESSÃO */

@media print{

body *{
visibility:hidden;
}

#editor, #editor *{
visibility:visible;
}

.grid{
display:none;
}

.campo{
background:none;
}

button{
display:none;
}

}

</style>

</head>

<body>

<header>
Sistema de Requisição de Mamografia
</header>

<div class="container">

<h3>Dados da paciente</h3>

<input id="nome" placeholder="Nome da paciente">

<button onclick="gerar()">Gerar Requisição</button>

</div>

<div id="editor">

<!-- PAGINA 1 -->

<div class="pagina">

<img src="formulario1.png" class="formbg">

<div class="grid"></div>

<!-- NOME DA PACIENTE -->

<div class="campo" id="r_nome" style="left:54.25mm; top:227.125mm;"></div>

</div>

<!-- PAGINA 2 -->

<div class="pagina">

<img src="formulario2.png" class="formbg">

<div class="grid"></div>

</div>

<center style="margin-top:20px">
<button onclick="window.print()">Imprimir</button>
</center>

</div>

<div id="coords">x:0 y:0</div>

<script>

/* GERAR REQUISIÇÃO */

function gerar(){

let nome = document.getElementById("nome").value

document.getElementById("r_nome").innerText = nome.toUpperCase()

document.getElementById("editor").style.display="block"

window.scrollTo(0,document.body.scrollHeight)

}

/* ARRASTAR CAMPOS */

let campoSelecionado=null
let offsetX=0
let offsetY=0

document.querySelectorAll(".campo").forEach(function(campo){

campo.addEventListener("mousedown",function(e){

campoSelecionado=campo
offsetX=e.offsetX
offsetY=e.offsetY

})

})

document.addEventListener("mousemove",function(e){

if(campoSelecionado){

let pagina=campoSelecionado.closest(".pagina").getBoundingClientRect()

let x=e.clientX-pagina.left-offsetX
let y=e.clientY-pagina.top-offsetY

campoSelecionado.style.left=x+"px"
campoSelecionado.style.top=y+"px"

document.getElementById("coords").innerText="x:"+x+" y:"+y

}

})

document.addEventListener("mouseup",function(){

campoSelecionado=null

})

</script>

</body>

</html>
