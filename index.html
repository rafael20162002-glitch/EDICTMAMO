<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Requisição de Mamografia</title>

<style>

body{
font-family:Arial;
background:#eef2f7;
margin:0;
}

header{
background:#003366;
color:white;
padding:20px;
text-align:center;
font-size:22px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:30px;
margin-top:30px;
border-radius:8px;
}

input{
width:100%;
padding:10px;
margin-bottom:10px;
}

button{
background:#0066cc;
color:white;
border:none;
padding:12px;
font-size:16px;
border-radius:5px;
cursor:pointer;
}

#editor{
display:none;
margin-top:40px;
}

/* PAGINAS */

.pagina{
width:210mm;
height:297mm;
position:relative;
margin:auto;
background:white;
page-break-after:always;
}

.formbg{
position:absolute;
top:0;
left:0;
width:100%;
}

/* CAIXAS DE TEXTO */

.campo{
position:absolute;
font-size:14px;
font-weight:bold;
letter-spacing:2px;
max-width:600px;
white-space:nowrap;
}

/* CHECKBOX */

.check{
position:absolute;
font-size:20px;
}

/* IMPRESSAO */

@media print{

body *{
visibility:hidden;
}

#editor, #editor *{
visibility:visible;
}

button{
display:none;
}

}

</style>

</head>

<body>

<header>
Sistema de Requisição de Mamografia
</header>

<div class="container">

<h3>Dados da paciente</h3>

<input id="nome" placeholder="Nome completo">

<input id="prontuario" placeholder="Número do prontuário">

<h3>Endereço</h3>

<input id="logradouro" placeholder="Logradouro">

<input id="numero" placeholder="Número">

<input id="complemento" placeholder="Complemento">

<input id="bairro" placeholder="Bairro">

<input id="cep" placeholder="CEP">

<input id="telefone" placeholder="Telefone">

<h3>Indicação clínica</h3>

<label><input type="checkbox" id="rastreamento"> Rastreamento</label><br>
<label><input type="checkbox" id="diagnostica"> Diagnóstica</label><br>
<label><input type="checkbox" id="nodulo"> Nódulo palpável</label><br>
<label><input type="checkbox" id="secrecao"> Secreção papilar</label><br>
<label><input type="checkbox" id="historico"> Histórico familiar</label><br>

<br>

<button onclick="gerar()">Gerar requisição</button>

</div>
