<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Sistema de Requisição de Mamografia</title>

<style>

body{
font-family:Arial;
background:#eef2f7;
margin:0;
}

header{
background:#003366;
color:white;
padding:20px;
text-align:center;
font-size:22px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:30px;
margin-top:30px;
border-radius:8px;
}

input{
width:100%;
padding:10px;
margin-bottom:10px;
}

button{
background:#0066cc;
color:white;
border:none;
padding:12px;
font-size:16px;
border-radius:5px;
cursor:pointer;
}

.pagina{
width:210mm;
height:297mm;
position:relative;
margin:auto;
background:white;
border:1px solid #ccc;
page-break-after:always;
}

.formbg{
position:absolute;
top:0;
left:0;
width:100%;
}

/* CAMPOS */

.campo{
position:absolute;
font-size:15px;
font-weight:bold;
letter-spacing:4px;
cursor:move;
background:rgba(255,255,0,0.3);
padding:2px;
white-space:nowrap;
}

.check{
position:absolute;
font-size:22px;
cursor:move;
background:rgba(0,255,0,0.3);
}

/* GRID */

.grid{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background-image:
linear-gradient(to right, rgba(0,0,0,0.1) 1px, transparent 1px),
linear-gradient(to bottom, rgba(0,0,0,0.1) 1px, transparent 1px);
background-size:20px 20px;
pointer-events:none;
}

#editor{
display:none;
margin-top:40px;
}

#coords{
position:fixed;
bottom:10px;
right:10px;
background:black;
color:white;
padding:10px;
font-size:12px;
}

@media print{

body *{
visibility:hidden;
}

#editor, #editor *{
visibility:visible;
}

.campo{
background:none;
}

.check{
background:none;
}

.grid{
display:none;
}

button{
display:none;
}

}

</style>

</head>
