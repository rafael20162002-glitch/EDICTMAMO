<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Sistema de Requisição de Mamografia</title>

<style>

body{
font-family:Arial;
background:#eef2f7;
margin:0;
}

header{
background:#003366;
color:white;
padding:20px;
text-align:center;
font-size:22px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:30px;
margin-top:30px;
border-radius:8px;
}

input{
width:100%;
padding:10px;
margin-bottom:10px;
}

button{
background:#0066cc;
color:white;
border:none;
padding:12px;
font-size:16px;
border-radius:5px;
cursor:pointer;
}

.pagina{
width:210mm;
height:297mm;
position:relative;
margin:auto;
border:1px solid #ccc;
background:white;
}

.formbg{
position:absolute;
top:0;
left:0;
width:100%;
}

.campo{
position:absolute;
font-size:16px;
font-weight:bold;
letter-spacing:6px;
cursor:move;
background:rgba(255,255,0,0.3);
padding:2px;
}

.check{
position:absolute;
font-size:22px;
cursor:move;
background:rgba(0,255,0,0.3);
}

.grid{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background-image:
linear-gradient(to right, rgba(0,0,0,0.1) 1px, transparent 1px),
linear-gradient(to bottom, rgba(0,0,0,0.1) 1px, transparent 1px);
background-size:20px 20px;
pointer-events:none;
}

#editor{
display:none;
margin-top:40px;
}

#coords{
position:fixed;
bottom:10px;
right:10px;
background:black;
color:white;
padding:10px;
font-size:12px;
}

@media print{

body *{
visibility:hidden;
}

#editor, #editor *{
visibility:visible;
}

.campo{
background:none;
}

.check{
background:none;
}

.grid{
display:none;
}

}

</style>

</head>

<body>

<header>
Sistema de Requisição de Mamografia
</header>

<div class="container">

<h3>Dados da paciente</h3>

<input id="nome" placeholder="Nome">

<input id="cpf" placeholder="CPF">

<input id="sus" placeholder="Cartão SUS">

<input id="nascimento" type="date">

<input id="mae" placeholder="Nome da mãe">

<h3>Unidade</h3>

<input id="uf" placeholder="UF">

<input id="municipio" placeholder="Município">

<input id="unidade" placeholder="Unidade de Saúde">

<input id="prontuario" placeholder="Prontuário">

<h3>Endereço</h3>

<input id="logradouro" placeholder="Logradouro">

<input id="numero" placeholder="Número">

<input id="complemento" placeholder="Complemento">

<input id="bairro" placeholder="Bairro">

<input id="cep" placeholder="CEP">

<input id="telefone" placeholder="Telefone">

<h3>Indicação clínica</h3>

<label><input type="checkbox" id="rastreamento"> Rastreamento</label><br>

<label><input type="checkbox" id="diagnostica"> Diagnóstica</label><br>

<label><input type="checkbox" id="nodulo"> Nódulo palpável</label><br>

<label><input type="checkbox" id="secrecao"> Secreção papilar</label><br>

<label><input type="checkbox" id="alteracao"> Alteração cutânea</label><br>

<label><input type="checkbox" id="historico"> Histórico familiar</label><br>

<label><input type="checkbox" id="dor"> Dor mamária</label>

<br><br>

<button onclick="gerar()">Gerar Requisição</button>

</div>

<div id="editor">

<div class="pagina">

<img src="formulario1.png" class="formbg">

<div class="grid"></div>

<div class="campo" id="r_nome" style="top:260px;left:60px"></div>

<div class="campo" id="r_cpf" style="top:300px;left:60px"></div>

<div class="campo" id="r_sus" style="top:340px;left:60px"></div>

<div class="campo" id="r_mae" style="top:380px;left:60px"></div>

<div class="campo" id="r_municipio" style="top:420px;left:60px"></div>

<div class="campo" id="r_unidade" style="top:460px;left:60px"></div>

<div class="campo" id="r_logradouro" style="top:500px;left:60px"></div>

<div class="campo" id="r_bairro" style="top:540px;left:60px"></div>

<div class="campo" id="r_cep" style="top:580px;left:60px"></div>

<div class="campo" id="r_telefone" style="top:620px;left:60px"></div>

<!-- MARCAÇÃO DOS QUADRADOS -->

<div class="check" id="c_rastreamento" style="top:700px;left:120px">X</div>

<div class="check" id="c_diagnostica" style="top:730px;left:120px">X</div>

<div class="check" id="c_nodulo" style="top:760px;left:120px">X</div>

<div class="check" id="c_secrecao" style="top:790px;left:120px">X</div>

<div class="check" id="c_alteracao" style="top:820px;left:120px">X</div>

<div class="check" id="c_historico" style="top:850px;left:120px">X</div>

<div class="check" id="c_dor" style="top:880px;left:120px">X</div>

</div>

</div>

<div id="coords">
x:0 y:0
</div>

<script>

function set(input,campo){

document.getElementById(campo).innerText =
document.getElementById(input).value.toUpperCase()

}

function marcar(idCheck,idCampo){

if(document.getElementById(idCheck).checked){

document.getElementById(idCampo).style.display="block"

}else{

document.getElementById(idCampo).style.display="none"

}

}

function gerar(){

set("nome","r_nome")
set("cpf","r_cpf")
set("sus","r_sus")
set("mae","r_mae")
set("municipio","r_municipio")
set("unidade","r_unidade")
set("logradouro","r_logradouro")
set("bairro","r_bairro")
set("cep","r_cep")
set("telefone","r_telefone")

marcar("rastreamento","c_rastreamento")
marcar("diagnostica","c_diagnostica")
marcar("nodulo","c_nodulo")
marcar("secrecao","c_secrecao")
marcar("alteracao","c_alteracao")
marcar("historico","c_historico")
marcar("dor","c_dor")

document.getElementById("editor").style.display="block"

}

let campoSelecionado=null
let offsetX=0
let offsetY=0

document.querySelectorAll(".campo,.check").forEach(campo=>{

campo.addEventListener("mousedown",e=>{

campoSelecionado=campo
offsetX=e.offsetX
offsetY=e.offsetY

})

})

document.addEventListener("mousemove",e=>{

if(campoSelecionado){

let pagina=document.querySelector(".pagina").getBoundingClientRect()

let x=e.clientX-pagina.left-offsetX
let y=e.clientY-pagina.top-offsetY

campoSelecionado.style.left=x+"px"
campoSelecionado.style.top=y+"px"

document.getElementById("coords").innerText="x:"+x+" y:"+y

}

})

document.addEventListener("mouseup",()=>{

campoSelecionado=null

})

</script>

</body>

</html>
